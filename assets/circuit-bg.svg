    <!-- Trace 2: second horizontal path -->
    <line x1="0" y1="260" x2="140" y2="260"/>
    <circle cx="140" cy="260" r="3.5" fill="#00AAFF"/>
    <line x1="140" y1="260" x2="140" y2="320"/>
    <circle cx="140" cy="320" r="3.5" fill="#00AAFF"/>
    <line x1="140" y1="320" x2="400" y2="320"/>
    <circle cx="400" cy="320" r="3.5" fill="#00AAFF"/>
    <line x1="400" y1="320" x2="400" y2="260"/>
    <line x1="400" y1="260" x2="680" y2="260"/>
    <circle cx="680" cy="260" r="3.5" fill="#00AAFF"/>
    <line x1="680" y1="260" x2="680" y2="380"/>
    <circle cx="680" cy="380" r="3.5" fill="#00AAFF"/>
    <line x1="680" y1="380" x2="1050" y2="380"/>
