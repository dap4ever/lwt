    <!-- Trace 3: mid path with branches -->
    <line x1="0" y1="450" x2="300" y2="450"/>
    <circle cx="300" cy="450" r="3.5" fill="#00AAFF"/>
    <line x1="300" y1="450" x2="300" y2="520"/>
    <circle cx="300" cy="520" r="3.5" fill="#00AAFF"/>
    <line x1="300" y1="520" x2="600" y2="520"/>
    <circle cx="600" cy="520" r="3.5" fill="#00AAFF"/>
    <line x1="600" y1="520" x2="600" y2="450"/>
    <line x1="600" y1="450" x2="850" y2="450"/>
    <circle cx="850" cy="450" r="3.5" fill="#00AAFF"/>
    <line x1="850" y1="450" x2="850" y2="560"/>
    <circle cx="850" cy="560" r="3.5" fill="#00AAFF"/>
    <line x1="850" y1="560" x2="1150" y2="560"/>
    <circle cx="1150" cy="560" r="3.5" fill="#00AAFF"/>
    <line x1="1150" y1="560" x2="1150" y2="450"/>
    <line x1="1150" y1="450" x2="1440" y2="450"/>

    <!-- Trace 4: bottom path -->
    <line x1="0" y1="640" x2="180" y2="640"/>
    <circle cx="180" cy="640" r="3.5" fill="#00AAFF"/>
    <line x1="180" y1="640" x2="180" y2="720"/>
    <circle cx="180" cy="720" r="3.5" fill="#00AAFF"/>
    <line x1="180" y1="720" x2="480" y2="720"/>
    <circle cx="480" cy="720" r="3.5" fill="#00AAFF"/>
    <line x1="480" y1="720" x2="480" y2="640"/>
    <line x1="480" y1="640" x2="760" y2="640"/>
    <circle cx="760" cy="640" r="3.5" fill="#00AAFF"/>
    <line x1="760" y1="640" x2="760" y2="750"/>
    <circle cx="760" cy="750" r="3.5" fill="#00AAFF"/>
    <line x1="760" y1="750" x2="1100" y2="750"/>
