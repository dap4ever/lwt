<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <g stroke="#00AAFF" fill="none" stroke-width="1.5" stroke-linecap="round">
    <!-- Trace 1: top horizontal path -->
    <line x1="0" y1="80" x2="220" y2="80"/>
    <circle cx="220" cy="80" r="3.5" fill="#00AAFF"/>
    <line x1="220" y1="80" x2="220" y2="180"/>
    <circle cx="220" cy="180" r="3.5" fill="#00AAFF"/>
    <line x1="220" y1="180" x2="520" y2="180"/>
    <circle cx="520" cy="180" r="3.5" fill="#00AAFF"/>
    <line x1="520" y1="180" x2="520" y2="80"/>
    <line x1="520" y1="80" x2="900" y2="80"/>
    <circle cx="900" cy="80" r="3.5" fill="#00AAFF"/>
    <line x1="900" y1="80" x2="900" y2="200"/>
    <circle cx="900" cy="200" r="3.5" fill="#00AAFF"/>
    <line x1="900" y1="200" x2="1200" y2="200"/>
    <circle cx="1200" cy="200" r="3.5" fill="#00AAFF"/>
    <line x1="1200" y1="200" x2="1200" y2="80"/>
    <line x1="1200" y1="80" x2="1420" y2="80"/>
