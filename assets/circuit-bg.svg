    <rect x="215" y="115" width="10" height="10" stroke="#00AAFF" fill="none"/>
    <rect x="515" y="115" width="10" height="10" stroke="#00AAFF" fill="none"/>
    <rect x="895" y="135" width="10" height="10" stroke="#00AAFF" fill="none"/>
    <rect x="135" y="295" width="10" height="10" stroke="#00AAFF" fill="none"/>
    <rect x="675" y="315" width="10" height="10" stroke="#00AAFF" fill="none"/>
    <rect x="1045" y="315" width="10" height="10" stroke="#00AAFF" fill="none"/>
    <rect x="295" y="485" width="10" height="10" stroke="#00AAFF" fill="none"/>
    <rect x="845" y="505" width="10" height="10" stroke="#00AAFF" fill="none"/>

    <!-- Arrow indicators -->
    <polygon points="1435,260 1420,253 1420,267" fill="#00AAFF"/>
    <polygon points="1435,450 1420,443 1420,457" fill="#00AAFF"/>
    <polygon points="1435,640 1420,633 1420,647" fill="#00AAFF"/>
